agent: codex
agent_args_override:
  codex:
    - -m
    - gpt-6.1-sol
    - -c
    - model_reasoning_effort="medium"
no_ci: true
commands:
  test: >-
    npm test && node --test tests/journey.test.mjs tests/vendor.test.mjs tests/private-file.test.mjs &&
    if [ -n "${ARTIUM_FIXTURE_ROOT:-}" ] && [ -n "${ARTIUM_FIXTURE_MANIFEST:-}" ]; then
      npm run check:journey -- --task B1.01 --paths native,artium --offline &&
      npm run check:journey -- --task B1.02 --paths native,artium --offline;
    else
      printf '%s\n' 'Artium fixture not supplied';
    fi
  lint: npm run typecheck && npm run check:generated
review:
  path_instructions:
    - path: "**"
      instructions: |
        Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.
